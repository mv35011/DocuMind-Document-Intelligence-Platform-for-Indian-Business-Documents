[project]
name = "documind"
version = "0.1.0"
description = "Document Intelligence Platform for Indian Business Documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manmohan Vishwakarma" }]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "celery[redis]>=5.3.6",
    "redis>=5.0.3",
    "boto3>=1.34.60",
    "qdrant-client>=1.8.2",
    "mlflow>=2.11.1",
    "peft>=0.10.0",
    "trl>=0.8.1",
    "transformers>=4.40.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.28.0",
    "pillow>=10.2.0",
    "pdf2image>=1.17.0",
    "opencv-python-headless>=4.9.0.80",
    "albumentations>=1.4.2",
    "rapidfuzz>=3.6.1",
    "sqlglot>=23.0.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "faker>=24.0.0",
    "jinja2>=3.1.3",
    "fastembed>=0.2.6",
    "streamlit>=1.32.0",
    "openai>=1.14.0",
    "python-multipart>=0.0.9",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.1.post1"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "hypothesis>=6.98.15",
    "pip-audit>=2.7.2",
    "weasyprint>=61.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["training/notebooks", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["training/notebooks", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
