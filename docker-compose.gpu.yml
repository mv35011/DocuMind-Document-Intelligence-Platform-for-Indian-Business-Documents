version: "3.8"

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: documind_vllm
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    command: >
      --model Qwen/Qwen2-VL-2B-Instruct
      --port 8000
      --dtype half
      --max-model-len 4096
      --enable-lora
      --lora-modules documind-qwen2-vl=/models/adapter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
